<!--
    tools/terminal-manager.html
    Terminal Manager — ajax-loaded into a shell-level DezWindow (js/main.js).
    Left: new terminal connection form. Right: saved sessions.
    Connecting opens a separate draggable terminal session window
    (terminal.html in auto-connect mode). The SSH password is entered inside
    the terminal itself, so no credentials are stored here.
-->
<div id="terminal-manager-panel" style="display:flex;min-height:380px;font-size:14px;">
    <!-- Left: new terminal form -->
    <div style="flex:1;padding:16px 18px;min-width:0;">
        <div class="ui form">
            <div class="field">
                <label>Connection Type</label>
                <select id="tm-conn-type" class="ui fluid dropdown">
                    <option value="ssh" selected>SSH</option>
                </select>
            </div>
            <div class="field">
                <label>Connect Using</label>
                <div style="display:flex;gap:6px;">
                    <button class="ui small button tm-mode-btn" id="tm-mode-local" onclick="tmSetMode('local')" style="flex:1;">Local Account</button>
                    <button class="ui small button tm-mode-btn" id="tm-mode-remote" onclick="tmSetMode('remote')" style="flex:1;">Remote Account</button>
                </div>
            </div>

            <!-- Local account mode: SSH into the KVM host itself -->
            <div id="tm-local-fields">
                <div class="field">
                    <label>User</label>
                    <select id="tm-local-user" class="ui fluid dropdown">
                        <option value="">Loading users…</option>
                    </select>
                </div>
            </div>

            <!-- Remote account mode: arbitrary host -->
            <div id="tm-remote-fields" style="display:none;">
                <div class="field">
                    <label>Host</label>
                    <input type="text" id="tm-host" placeholder="Example: 192.168.1.100">
                </div>
                <div class="field">
                    <label>Port</label>
                    <input type="number" id="tm-port" value="22" min="1" max="65535">
                </div>
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="tm-username" placeholder="root">
                </div>
            </div>

            <p style="font-size:0.82em;color:var(--dez-text-sub);margin:0.6em 0 1em;">
                <i class="lock icon"></i> The SSH password is entered inside the terminal window.
            </p>

            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="ui basic button" onclick="tmClose()">Cancel</button>
                <button class="ui primary button" onclick="tmConnect()">
                    <i class="exchange icon"></i> Connect
                </button>
            </div>
        </div>
    </div>

    <!-- Right: saved sessions -->
    <div style="width:270px;border-left:1px solid var(--dez-border);background:var(--dez-surface-2);display:flex;flex-direction:column;">
        <div style="padding:14px 14px 8px;display:flex;align-items:center;gap:6px;">
            <b style="flex:1;">Saved Sessions</b>
            <button class="ui mini basic icon button" title="Clear all saved sessions" onclick="tmClearSessions()" style="margin:0;">
                <i class="trash icon"></i>
            </button>
        </div>
        <div style="padding:0 14px 8px;">
            <div class="ui fluid input">
                <input type="text" id="tm-session-search" placeholder="Search sessions…" oninput="tmRenderSessions()">
            </div>
        </div>
        <div id="tm-session-list" style="flex:1;overflow-y:auto;padding:0 10px 12px;"></div>
    </div>
</div>

<script>
(function () {
    let tmMode = 'local';

    window.tmSetMode = function (mode) {
        tmMode = mode;
        document.getElementById('tm-local-fields').style.display = mode === 'local' ? '' : 'none';
        document.getElementById('tm-remote-fields').style.display = mode === 'remote' ? '' : 'none';
        document.getElementById('tm-mode-local').classList.toggle('primary', mode === 'local');
        document.getElementById('tm-mode-remote').classList.toggle('primary', mode === 'remote');
    };

    window.tmClose = function () {
        const win = DezWindow.get('terminal-manager');
        if (win) win.close();
    };

    window.tmConnect = function () {
        let server, port, username;
        if (tmMode === 'local') {
            server = '127.0.0.1';
            port = 22;
            username = document.getElementById('tm-local-user').value;
            if (!username) {
                $.toast({ message: '<i class="yellow warning icon"></i> Select a user first', duration: 3000 });
                return;
            }
        } else {
            server = document.getElementById('tm-host').value.trim();
            port = parseInt(document.getElementById('tm-port').value, 10) || 22;
            username = document.getElementById('tm-username').value.trim() || 'root';
            if (!server) {
                $.toast({ message: '<i class="yellow warning icon"></i> Enter a host name or IP address', duration: 3000 });
                return;
            }
        }
        launchTerminalSession(server, port, username);
        tmClose();
    };

    /* ---- saved sessions (localStorage) ---- */

    function tmGetSessions() {
        try {
            const list = JSON.parse(localStorage.getItem('dezkvm.terminal.sessions'));
            if (Array.isArray(list)) return list;
        } catch (e) { /* default below */ }
        return [];
    }

    window.tmRenderSessions = function () {
        const listEl = document.getElementById('tm-session-list');
        if (!listEl) return;
        const filter = (document.getElementById('tm-session-search').value || '').toLowerCase();
        const sessions = tmGetSessions().filter(function (s) {
            const label = s.username + '@' + s.server + ':' + s.port;
            return label.toLowerCase().includes(filter);
        });

        listEl.innerHTML = '';
        if (sessions.length === 0) {
            listEl.innerHTML = '<p style="color:var(--dez-text-sub);font-size:0.85em;padding:8px 4px;">No saved sessions yet. Sessions are saved automatically when you connect.</p>';
            return;
        }
        sessions.forEach(function (s) {
            const item = document.createElement('div');
            item.style.cssText = 'display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;cursor:pointer;';
            item.className = 'tm-session-entry';
            item.onmouseenter = function () { item.style.background = 'rgba(0,0,0,0.05)'; };
            item.onmouseleave = function () { item.style.background = ''; };

            const text = document.createElement('div');
            text.style.cssText = 'flex:1;min-width:0;line-height:1.3;';
            const title = document.createElement('b');
            title.style.cssText = 'display:block;font-size:0.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
            title.textContent = s.name || (s.username + '@' + s.server);
            const sub = document.createElement('small');
            sub.style.cssText = 'display:block;color:var(--dez-text-sub);font-size:0.8em;';
            sub.textContent = s.username + '@' + s.server + ':' + s.port;
            text.appendChild(title);
            text.appendChild(sub);

            const del = document.createElement('button');
            del.className = 'ui mini basic icon button';
            del.style.cssText = 'margin:0;padding:0.3em 0.45em;flex-shrink:0;';
            del.innerHTML = '<i class="times icon" style="margin:0;"></i>';
            del.title = 'Remove saved session';
            del.onclick = function (e) {
                e.stopPropagation();
                const remaining = tmGetSessions().filter(function (x) {
                    return !(x.server === s.server && x.port === s.port && x.username === s.username);
                });
                localStorage.setItem('dezkvm.terminal.sessions', JSON.stringify(remaining));
                tmRenderSessions();
            };

            item.appendChild(text);
            item.appendChild(del);
            item.onclick = function () {
                launchTerminalSession(s.server, s.port, s.username);
                tmClose();
            };
            listEl.appendChild(item);
        });
    };

    window.tmClearSessions = function () {
        localStorage.removeItem('dezkvm.terminal.sessions');
        tmRenderSessions();
    };

    /* ---- init ---- */
    tmSetMode('local');
    tmRenderSessions();

    // Populate local users
    $.get('/api/tools/whoami', function (response) {
        const sel = document.getElementById('tm-local-user');
        if (!sel) return;
        sel.innerHTML = '';
        const users = (response.users && response.users.length > 0) ? response.users : [response.current];
        users.forEach(function (user) {
            const opt = document.createElement('option');
            opt.value = user;
            opt.textContent = user === response.current ? user + ' (current)' : user;
            if (user === response.current) opt.selected = true;
            sel.appendChild(opt);
        });
    }).fail(function () {
        document.getElementById('tm-local-user').innerHTML = '<option value="root">root</option>';
    });
})();
</script>
